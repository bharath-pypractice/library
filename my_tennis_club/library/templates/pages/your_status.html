<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Status</title>
</head>
<body>
    <h1>Your Status</h1>
    <p>Student ID: {{ student.student_id }}</p>
    <p>Name: {{ student.student_name }}</p>
    <p>Department: {{ student.dept }}</p>
    <p>Email: {{ student.email }}</p>
    <p>Status: {% if student.status == 0 %}Pending{% elif student.status == 1 %}Approved{% endif %}</p>
</body>
</html>
