<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks Example</title>
</head>
<body>
    <h1>Hyperlinks Using &lt;a&gt; Tag</h1>
    
    <h3>1. Open Link in the Same Tab</h3>
    <a href="https://en.wikipedia.org/wiki/Ratan_Tata">tanam tata</a>
    
    <h3>2. Open Link in a New Tab</h3>
    <a href="https://en.wikipedia.org/wiki/Vijay_(actor)" target="_blank"> vijay thalapathy Wikipedia</a>
</body>
</html>
