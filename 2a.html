<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table Example</title>
</head>
<body>

    <h1>Table Example with <code>&lt;table&gt;</code>, <code>&lt;tr&gt;</code>, <code>&lt;th&gt;</code>, <code>&lt;td&gt;</code></h1>

    <table border="1">
        <tr>
            <th rowspan="2">Name</th>  
            <th colspan="10">My Information</th>  
        </tr>
        <tr>
            <th>Email</th>
            <th>Phone</th>
        </tr>
        <tr>
            <td>Bharath</td>
            <td>abc@gmail.com</td>
            <td>123-456-7890</td>
        </tr>
        <tr>
            <td>praveen kumar</td>
            <td>abc@gmail</td>
            <td>987-654-3210</td>
        </tr>
    </table>

</body>
</html>
